<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AgenciaOS{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            min-height: 100vh;
            background-color: #212529;
        }
        .sidebar .nav-link {
            color: #adb5bd;
            padding: 0.8rem 1rem;
            border-radius: 0.375rem;
            margin-bottom: 0.2rem;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #343a40;
        }
        .sidebar .nav-link i {
            width: 24px;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
            <h4 class="text-warning text-center py-3 border-bottom border-secondary mb-4">
                🚀 AgenciaOS
            </h4>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">
                        <i class="fa-solid fa-chart-pie me-2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'kanban' %}">
                        <i class="fa-solid fa-list-check me-2"></i> Kanban
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cronograma' %}">
                        <i class="fa-solid fa-calendar-days me-2"></i> Cronograma
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'crear_proyecto' %}">
                        <i class="fa-solid fa-folder-open me-2"></i> Proyectos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'crear_cliente' %}">
                        <i class="fa-solid fa-users me-2"></i> Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'crear_campana' %}">
                        <i class="fa-solid fa-bullhorn me-2"></i> Campañas
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Contenido Principal -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                <h1 class="h3 fw-bold text-dark">{% block header %}Panel Principal{% endblock %}</h1>
            </header>

            {% block content %}
            <!-- El contenido específico de cada página se renderiza aquí -->
            {% endblock %}
        </main>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
