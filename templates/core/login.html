<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AgencyOS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        .hero-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(168, 85, 247, 0.15) 40%, rgba(15, 23, 42, 0) 70%);
            z-index: 0;
            pointer-events: none;
        }
        .card-custom {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(168, 85, 247, 0.5);
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 position-relative">

    <div class="hero-bg"></div>

    <div class="container position-relative z-1" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center gap-2 mb-2">
                <i class="bi bi-kanban-fill text-primary fs-2"></i>
                <span class="fw-bold fs-3 text-white">Agency<span class="text-primary">OS</span></span>
            </div>
            <p class="text-secondary small">Ingresa tus credenciales para acceder a la plataforma</p>
        </div>

        <div class="card-custom p-4 p-sm-5">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger py-2 small border-0 bg-danger bg-opacity-20 text-danger text-center mb-4">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Tu usuario" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-gradient w-100 fw-bold">
                    Iniciar Sesión <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="{% url 'inicio' %}" class="text-secondary text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Volver a la página principal
            </a>
        </div>
    </div>

</body>
</html>
