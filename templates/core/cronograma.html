{% extends 'base.html' %}

{% block title %}Cronograma de Entregas - AgenciaOS{% endblock %}
{% block header %}Cronograma de Entregas de Piezas Publicitarias{% endblock %}

{% block content %}
<!-- FullCalendar CDN -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

<div class="card border-0 shadow-sm p-4 bg-white rounded-3">
    <div id="calendar"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'es',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listWeek'
            },
            events: [
                {% for item in entregables %}
                {
                    title: '{{ item.titulo|escapejs }} ({{ item.rol_responsable|default:"Gral" }})',
                    start: '{{ item.fecha_entrega|date:"Y-m-d" }}',
                    color: '{% if item.estado == "APROBADO" %}#198754{% elif item.estado == "CORRECCION" %}#dc3545{% elif item.estado == "EN_PROCESO" %}#0dcaf0{% else %}#ffc107{% endif %}',
                    textColor: '{% if item.estado == "PENDIENTE" %}#000{% else %}#fff{% endif %}'
                }{% if not forloop.last %},{% endif %}
                {% endfor %}
            ]
        });
        calendar.render();
    });
</script>
{% endblock %}
