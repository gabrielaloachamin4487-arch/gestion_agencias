{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-white shadow-lg border-0 rounded-lg">
                <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fas fa-user-edit text-warning me-2"></i>Editar Cliente</h5>
                    <a href="{% url 'crear_cliente' %}" class="btn btn-sm btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i> Volver
                    </a>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold">Nombre de la Empresa</label>
                            {{ form.nombre_empresa }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold">Nombre de Contacto</label>
                            {{ form.contacto_nombre }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold">Correo Electrónico</label>
                            {{ form.email }}
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase fw-bold">Presupuesto Asignado ($)</label>
                            {{ form.presupuesto_total }}
                        </div>
                        <div class="d-flex gap-2 pt-2">
                            <button type="submit" class="btn btn-warning w-100 fw-bold">
                                <i class="fas fa-sync-alt me-1"></i> Actualizar Cliente
                            </button>
                            <a href="{% url 'crear_cliente' %}" class="btn btn-secondary w-100">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
